; Application PHP overrides.
upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 512M
max_execution_time = 120

; OPcache — the app code is baked into the image, so no timestamp checks.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

; Log errors to stderr so they show up in `docker logs`.
error_log = /proc/self/fd/2
